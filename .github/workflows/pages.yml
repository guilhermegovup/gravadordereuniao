name: Publicar PWA no GitHub Pages

# O site é servido pelo branch gh-pages; este workflow mantém o branch
# sincronizado com o conteúdo de web/ a cada push no main.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publica web/ no branch gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix web -b gh-pages-content
          git push -f origin gh-pages-content:gh-pages
